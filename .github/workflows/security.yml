name: Desktop and API security
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --locked --project backend
      - run: npm audit --audit-level=low
      - run: uv tool run pip-audit --path backend/.venv/lib/python3.12/site-packages --progress-spinner off
      - name: Scan tracked files for new secrets
        run: git ls-files -z | xargs -0 uv tool run --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run pytest -q
        working-directory: backend
      - run: node --test scripts/prepare-release.test.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 --timeout=90000
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: digita
          POSTGRES_DB: digita_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U digita -d digita_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --project backend
      - run: uv run pytest -q
        working-directory: backend
        env:
          DIGITA_TEST_DATABASE_URL: postgresql+psycopg://digita@127.0.0.1:5432/digita_test
