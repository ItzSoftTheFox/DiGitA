name: Desktop installers
# Paused at owner request: no hosted runners until billing is resolved.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installers:
    if: ${{ false }} # Explicit pause; manual dispatch also skips this job.
    # Serialize uploads to avoid concurrent creation/update of the same draft.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            bundles: nsis/*.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            bundles: dmg/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
            bundles: dmg/*.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            bundles: deb/*.deb,appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VITE_API_URL: ${{ vars.DIGITA_API_URL }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libfuse2
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: node --test scripts/prepare-release.test.mjs
      - name: Validate tag and public API; generate release CSP
        run: node scripts/prepare-release.mjs
      - run: npm test
      - run: cargo test --locked --manifest-path crates/git-presence/Cargo.toml
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: python
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          import os
          import uuid
          keys = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY',
                  'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']
          values = {key: os.environ.get(key, '') for key in keys}
          if any(values.values()) and not all(values.values()):
              raise SystemExit('Provide all six Apple signing/notarization secrets, or none for a test build.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  if value:
                      marker = uuid.uuid4().hex
                      output.write(f'{key}<<{marker}\n{value}\n{marker}\n')
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DiGitA ${{ github.ref_name }}
          releaseBody: "Desktop pilot for Windows x64, macOS Apple Silicon/Intel and Linux x64. Publish only after all four installer jobs and manual installation checks pass. See docs/desktop-release.md."
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.generated.json -- --locked
      - name: Installer checksums
        shell: python
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          BUNDLE_PATTERNS: ${{ matrix.bundles }}
          CHECKSUM_NAME: SHA256SUMS-${{ matrix.artifact }}.txt
        run: |
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['BUNDLE_ROOT'])
          lines = []
          for pattern in os.environ['BUNDLE_PATTERNS'].split(','):
              files = sorted(root.glob(pattern))
              if not files:
                  raise SystemExit(f'Missing expected installer: {pattern}')
              for file in files:
                  with file.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  lines.append(f'{digest}  {file.name}\n')
          Path(os.environ['CHECKSUM_NAME']).write_text(''.join(lines), encoding='utf-8')
      - name: Upload platform checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKSUM_NAME: SHA256SUMS-${{ matrix.artifact }}.txt
        run: gh release upload "$RELEASE_TAG" "$CHECKSUM_NAME" --clobber
