  <text x="76" y="252" fill="#eeeeea" font-family="Arial, Helvetica, sans-serif" font-size="52" letter-spacing="-2">A quieter workspace.</text>
  <text x="76" y="313" fill="#eeeeea" font-family="Arial, Helvetica, sans-serif" font-size="52" letter-spacing="-2">Better teamwork.</text>
  <path d="M80 362h664" stroke="#383838"/>
