<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none">
  <title>DiGitA — A quieter workspace for better teamwork.</title>
  <desc>Monochrome DiGitA banner with the app's geometric mark and connected Git branches.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#202020" stroke-width="1"/></pattern>
    <linearGradient id="fade"><stop stop-color="#0c0c0c"/><stop offset="1" stop-color="#0c0c0c" stop-opacity="0"/></linearGradient>
